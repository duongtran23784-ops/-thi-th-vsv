<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacteria & Fungi Exam Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #10b981; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        #app { width: 95%; max-width: 800px; padding: 20px; }
        .card { background: var(--card); border-radius: 24px; padding: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        h1 { font-family: 'Outfit', sans-serif; text-align: center; margin-bottom: 10px; background: linear-gradient(to right, #818cf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 1rem; }
        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; font-size: 1rem; margin-top: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; color: #94a3b8; font-weight: 600; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-bottom: 25px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }
        .question-box h2 { font-size: 1.3rem; margin-bottom: 25px; line-height: 1.5; font-weight: 500; }
        .option-btn { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; color: var(--text); text-align: left; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 12px; font-size: 1.05rem; }
        .option-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); }
        .option-btn.correct { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--secondary) !important; color: #10b981; font-weight: 600; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; color: #ef4444; }
        .fib-input { width: 100%; background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 15px; color: var(--text); font-size: 1.2rem; outline: none; margin-bottom: 15px; }
        .explanation { margin-top: 20px; padding: 22px; background: rgba(255,255,255,0.05); border-left: 5px solid var(--primary); display: none; border-radius: 12px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .cite { color: var(--secondary); font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 8px; text-transform: uppercase; }
        .hidden { display: none; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; border: 8px solid var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0 auto 25px; }
    </style>
</head>
<body>

<div id="app">
    <div id="menu" class="card">
        <h1>Microbiology Prep</h1>
        <p class="subtitle">Mô phỏng đề thi: Vi khuẩn & Vi nấm (50 câu/đề)</p>
        <button class="btn" onclick="sim.start(1)">BẮT ĐẦU BỘ ĐỀ SỐ 1</button>
        <button class="btn" style="background:#4338ca; margin-top:15px;" onclick="sim.start(2)">BẮT ĐẦU BỘ ĐỀ SỐ 2</button>
        <p style="text-align:center; margin-top:20px; color:#64748b; font-size:0.85rem;">Mỗi đề gồm 25 câu Trắc nghiệm & 25 câu Điền từ</p>
    </div>

    <div id="quiz" class="card hidden">
        <div class="stats">
            <span id="q-idx">Câu hỏi: 1/50</span>
            <span id="q-score">Điểm: 0</span>
        </div>
        <div class="progress-bar"><div id="fill" class="progress-fill"></div></div>
        <div id="q-box"></div>
        <div id="exp" class="explanation">
            <span class="cite" id="exp-cite">NGUỒN KIẾN THỨC</span>
            <p id="exp-txt"></p>
        </div>
        <button id="next" class="btn hidden" onclick="sim.next()">TIẾP THEO</button>
    </div>

    <div id="res" class="card hidden" style="text-align:center;">
        <h1>Kết Quả</h1>
        <div class="score-circle"><span id="f-score" style="font-size: 3.5rem; font-weight: 800; color: var(--secondary);">0</span></div>
        <p id="msg" style="color: #94a3b8; margin-bottom: 30px; line-height: 1.6;"></p>
        <button class="btn" onclick="location.reload()">LÀM LẠI</button>
    </div>
</div>

<script>
const examData = {
    1: [
        // --- MCQ (25 CÂU) ---
        { type: "mcq", question: "Thành phần cấu tạo chính của thành tế bào nấm là gì?", options: ["Peptidoglycan", "Chitin và Glucan", "Cellulose", "Lipopolysaccharide"], answer: "Chitin và Glucan", cite: "TRANG 6 - PDF VI NẤM", exp: "Nấm dùng chitin/glucan thay vì peptidoglycan như vi khuẩn." },
        { type: "mcq", question: "Kích thước phổ biến của phần lớn tế bào vi khuẩn là bao nhiêu?", options: ["0,5–5 µm", "10–100 µm", "1–10 nm", "0,1–1 mm"], answer: "0,5–5 µm", cite: "TRANG 1 - PDF VI KHUẨN", exp: "Hầu hết tế bào nhân sơ nhỏ hơn nhiều so với nhân thực." },
        { type: "mcq", question: "Nấm lấy chất dinh dưỡng từ môi trường theo cơ chế nào?", options: ["Quang hợp", "Hấp thụ (Hóa dị dưỡng)", "Thực bào", "Cố định đạm"], answer: "Hấp thụ (Hóa dị dưỡng)", cite: "TRANG 10 - PDF VI NẤM", exp: "Nấm tiết enzyme ngoại bào để phân hủy chất hữu cơ." },
        { type: "mcq", question: "Vi khuẩn Gram dương giữ được màu tím tinh thể nhờ lớp peptidoglycan dày bao nhiêu lớp?", options: ["1-2 lớp", "5-10 lớp", "30-45 lớp", "Trên 100 lớp"], answer: "30-45 lớp", cite: "TRANG 3 - PDF VI KHUẨN", exp: "Độ dày này bẫy phức hợp màu khi nhuộm Gram." },
        { type: "mcq", question: "Sợi nấm cộng bào (Coenocytic) có đặc điểm nổi bật là?", options: ["Nhiều vách ngăn ngang", "Không có vách ngăn ngang", "Chỉ có một nhân duy nhất", "Làm từ tinh bột"], answer: "Không có vách ngăn ngang", cite: "TRANG 26 - PDF VI NẤM", exp: "Nhân và bào quan lưu thông tự do trong sợi nấm." },
        { type: "mcq", question: "Chất nào giúp nội bào tử vi khuẩn có khả năng chịu nhiệt cực cao?", options: ["Axit amin", "LPS", "Axit Dipicolinic và Ca2+", "Axit teichoic"], answer: "Axit Dipicolinic và Ca2+", cite: "TRANG 7 - PDF VI KHUẨN", exp: "Ổn định cấu trúc DNA dưới tác động nhiệt." },
        { type: "mcq", question: "Nấm men sinh sản vô tính bằng hình thức nào?", options: ["Tạo bào tử nang", "Nảy chồi", "Tiếp hợp", "Tạo bào tử đảm"], answer: "Nảy chồi", cite: "TRANG 37 - PDF VI NẤM", exp: "Tế bào chồi mọc từ tế bào mẹ và tách rời." },
        { type: "mcq", question: "Vi khuẩn Rhizobium có vai trò quan trọng gì trong tự nhiên?", options: ["Gây loét dạ dày", "Cố định đạm khí quyển cộng sinh", "Sản xuất kháng sinh", "Phân hủy gỗ"], answer: "Cố định đạm khí quyển cộng sinh", cite: "TRANG 12 - PDF VI KHUẨN", exp: "Sống cộng sinh trong nốt rễ cây họ Đậu." },
        { type: "mcq", question: "Địa y là kết hợp cộng sinh giữa nấm và sinh vật nào?", options: ["Rễ cây", "Tảo hoặc Vi khuẩn lam", "Động vật", "Vi khuẩn Gram dương"], answer: "Tảo hoặc Vi khuẩn lam", cite: "TRANG 68 - PDF VI NẤM", exp: "Mối quan hệ tương hỗ quang hợp - nơi ở." },
        { type: "mcq", question: "Vi khuẩn gây loét dạ dày ở người thuộc phân nhóm Proteobacteria nào?", options: ["Alpha", "Beta", "Gamma", "Epsilon"], answer: "Epsilon", cite: "TRANG 12 - PDF VI KHUẨN", exp: "Đại diện là Helicobacter pylori." },
        { type: "mcq", question: "Cấu trúc Haustoria ở nấm ký sinh có chức năng gì?", options: ["Di chuyển", "Hút dinh dưỡng từ vật chủ", "Sinh sản hữu tính", "Quang hợp"], answer: "Hút dinh dưỡng từ vật chủ", cite: "TRANG 25 - PDF VI NẤM", exp: "Sợi hút đâm sâu vào mô cây chủ." },
        { type: "mcq", question: "Vi khuẩn Gram âm có thành phần nào ở màng ngoài gây sốc cho vật chủ?", options: ["Peptidoglycan", "Lipopolysaccharide (LPS)", "Axit teichoic", "Protein S"], answer: "Lipopolysaccharide (LPS)", cite: "TRANG 14 - PDF VI KHUẨN", exp: "LPS là nội độc tố giải phóng khi vi khuẩn chết." },

        { type: "mcq", question: "Môi trường Sabouraud dùng để nuôi cấy nấm chủ yếu chứa?", options: ["Thạch máu", "Glucose và Peptone", "Lactose", "Muối mặn 32%"], answer: "Glucose và Peptone", cite: "TRANG 11 - PDF VI NẤM", exp: "Môi trường dinh dưỡng cơ bản cho vi nấm." },
        { type: "mcq", question: "Vi khuẩn 'hóa tự dưỡng' (Chemoautotroph) lấy carbon từ đâu?", options: ["Chất hữu cơ", "CO2", "Ánh sáng", "Nước"], answer: "CO2", cite: "TRANG 10 - PDF VI KHUẨN", exp: "Lấy năng lượng từ hóa chất và carbon từ CO2." },
        { type: "mcq", question: "Xạ khuẩn (Actinomyces) có hình thái đặc trưng là?", options: ["Hình cầu đơn độc", "Hệ sợi phân nhánh", "Hình viên gạch", "Hình xoắn"], answer: "Hệ sợi phân nhánh", cite: "TRANG 3 - PDF VI KHUẨN", exp: "Dễ bị nhầm với nấm nhưng là vi khuẩn nhân sơ." },
        { type: "mcq", question: "Mỗi túi ascus ở nấm túi thường chứa bao nhiêu bào tử nang?", options: ["2", "4", "8", "16"], answer: "8", cite: "TRANG 53 - PDF VI NẤM", exp: "Số lượng bào tử chuẩn ở ngành Ascomycota." },
        { type: "mcq", question: "Kháng sinh Penicillin tiêu diệt vi khuẩn bằng cách?", options: ["Phá hủy DNA", "Ức chế tổng hợp cầu nối peptit", "Phá hủy Ribosome", "Ngăn cản di chuyển"], answer: "Ức chế tổng hợp cầu nối peptit", cite: "TRANG 3 - PDF VI KHUẨN", exp: "Làm thành tế bào yếu đi và gây vỡ tế bào." },
        { type: "mcq", question: "Nystatin là thuốc kháng nấm đặc hiệu trị bệnh nào?", options: ["Nấm Candida", "Bệnh than", "Giang mai", "Sốt rét"], answer: "Nấm Candida", cite: "TRANG 79 - PDF VI NẤM", exp: "Được Hazen và Brown tìm ra năm 1950." },
        { type: "mcq", question: "Vi khuẩn Mycoplasma có đặc điểm gì khác biệt?", options: ["Thành tế bào dày", "Không có thành tế bào", "Sống ở 100 độ C", "Quang hợp tạo Oxy"], answer: "Không có thành tế bào", cite: "TRANG 3 - PDF VI KHUẨN", exp: "Là vi khuẩn nhỏ nhất và không có thành tế bào." },
        { type: "mcq", question: "Cấu trúc Rhizomorph ở nấm đảm có hình dạng giống?", options: ["Cánh hoa", "Rễ cây", "Mạng nhện", "Bào tử"], answer: "Rễ cây", cite: "TRANG 59 - PDF VI NẤM", exp: "Các bó sợi khuẩn ty quấn chặt." },
        { type: "mcq", question: "Hạt vùi Volutin trong tế bào vi khuẩn dự trữ gì?", options: ["Lipid", "Tinh bột", "Photphat", "Lưu huỳnh"], answer: "Photphat", cite: "TRANG 6 - PDF VI KHUẨN", exp: "Nguồn năng lượng dự trữ cho tế bào." },

const sim = {
    exam: [], cur: 0, score: 0, done: false,
    start(id) {
        this.exam = examData[id]; this.cur = 0; this.score = 0;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('quiz').classList.remove('hidden');
        this.show();
    },
    show() {
        this.done = false; const q = this.exam[this.cur];
        const box = document.getElementById('q-box');
        document.getElementById('exp').style.display = 'none';
        document.getElementById('next').classList.add('hidden');
        document.getElementById('q-idx').innerText = `Câu hỏi: ${this.cur + 1}/50`;
        document.getElementById('fill').style.width = `${((this.cur + 1)/50)*100}%`;
        let h = `<h2>${q.question}</h2>`;
        if(q.type === 'mcq') h += q.options.map(o => `<button class="option-btn" onclick="sim.ansMCQ('${o.replace(/'/g, "\\'")}', this)">${o}</button>`).join('');
        else h += `<input type="text" id="ans_in" class="fib-input" placeholder="Đáp án của bạn..." autocomplete="off">
                   <button class="btn" onclick="sim.ansFIB()">GỬI ĐÁP ÁN</button>`;
        box.innerHTML = h;
    },
    ansMCQ(v, el) {
        if(this.done) return; this.done = true; const q = this.exam[this.cur];
        if(v === q.answer) { el.classList.add('correct'); this.score += 2; this.rev(true); }
        else { el.classList.add('wrong'); document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); }); this.rev(false); }
    },
    ansFIB() {
        if(this.done) return; this.done = true; const q = this.exam[this.cur]; const input = document.getElementById('ans_in');
        const isC = q.answer.toLowerCase().split('/').some(a => input.value.trim().toLowerCase().includes(a.trim()));
        if(isC) { this.score += 2; this.rev(true); } else { this.rev(false); }
    },
    rev(c) {
        const q = this.exam[this.cur];
        document.getElementById('exp-cite').innerText = q.cite;
        document.getElementById('exp-txt').innerText = (c ? "CHÍNH XÁC! " : "SAI. Đáp án đúng là: " + q.answer + ". ") + q.exp;
        document.getElementById('exp').style.display = 'block';
        document.getElementById('next').classList.remove('hidden');
        document.getElementById('q-score').innerText = `Điểm: ${this.score}`;
    },
    next() {
        this.cur++;
        if(this.cur < this.exam.length) this.show();
        else this.finish();
    },
    finish() {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('res').classList.remove('hidden');
        document.getElementById('f-score').innerText = this.score;
        document.getElementById('msg').innerText = this.score >= 80 ? "Xuất sắc! Bạn đã nắm chắc kiến thức Vi khuẩn & Vi nấm." : "Khá tốt. Hãy xem lại các câu sai để chuẩn bị tốt hơn.";
    }
};
